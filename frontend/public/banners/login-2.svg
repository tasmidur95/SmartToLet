<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice"><style>.c1{animation:d 40s linear infinite alternate}.c2{animation:d 55s linear infinite alternate-reverse}@keyframes d{to{transform:translateX(220px)}}.w{fill:#fde68a;animation:b 4s ease-in-out infinite}.w2{animation-delay:1.3s}.w3{animation-delay:2.6s}@keyframes b{50%{opacity:.35}}.sway{transform-origin:50% 100%;animation:s 5s ease-in-out infinite}@keyframes s{50%{transform:rotate(3deg)}}.bob{animation:o 3s ease-in-out infinite}@keyframes o{50%{transform:translateY(-14px)}}.sun{animation:p 6s ease-in-out infinite;transform-origin:900px 330px}@keyframes p{50%{transform:scale(1.08)}}</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8e3"/><stop offset=".65" stop-color="#e6f4ea"/><stop offset="1" stop-color="#fde68a"/></linearGradient></defs>
<rect width="1200" height="1600" fill="url(#sky)"/><g class="c1" fill="#fff" opacity=".85"><ellipse cx="200" cy="220" rx="130" ry="34"/><ellipse cx="290" cy="196" rx="80" ry="30"/></g><g class="c2" fill="#fff" opacity=".7"><ellipse cx="700" cy="120" rx="150" ry="34"/><ellipse cx="800" cy="96" rx="90" ry="28"/></g>
<rect x="180" y="380" width="840" height="1000" rx="20" fill="#f1f5f9"/><rect x="180" y="380" width="840" height="30" fill="#0f766e"/>
<rect x="420" y="640" width="360" height="740" rx="18" fill="#065f46"/><rect x="450" y="670" width="300" height="300" rx="10" fill="#0f766e"/><rect x="450" y="1000" width="300" height="340" rx="10" fill="#0f766e"/><circle cx="720" cy="1040" r="18" fill="#fde047"/>
<g style="transform-origin:600px 520px;animation:sw 4s ease-in-out infinite"><line x1="600" y1="410" x2="600" y2="520" stroke="#7c5a3a" stroke-width="6"/><rect x="520" y="520" width="160" height="90" rx="14" fill="#fde047"/><circle cx="560" cy="565" r="12" fill="#065f46"/><rect x="585" y="552" width="70" height="10" rx="5" fill="#065f46"/><rect x="585" y="572" width="50" height="10" rx="5" fill="#065f46"/></g>
<style>@keyframes sw{50%{transform:rotate(8deg)}}</style>
<g class="bob"><circle cx="270" cy="1020" r="46" fill="#fcd9b6"/><rect x="220" y="1066" width="100" height="270" rx="30" fill="#14a89b"/><rect x="300" y="1130" width="140" height="26" rx="13" fill="#fcd9b6"/><g transform="translate(430 1128)"><circle r="20" fill="none" stroke="#fde047" stroke-width="9"/><rect x="18" y="-5" width="60" height="10" fill="#fde047"/><rect x="58" y="5" width="9" height="20" fill="#fde047"/><rect x="42" y="5" width="9" height="14" fill="#fde047"/></g></g>
<rect y="1380" width="1200" height="220" fill="#0f766e"/><g class="sway"><rect x="940" y="1250" width="60" height="130" rx="8" fill="#b45309"/><circle cx="970" cy="1220" r="60" fill="#22c55e"/></g>
</svg>
