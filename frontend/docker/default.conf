# behind ngrok the original scheme arrives in X-Forwarded-Proto; locally fall back to our own scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    # Laravel API at <public url>/backend/...  (prefix is stripped before it reaches Laravel)
    location /backend/ {
        proxy_pass http://backend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # single-page app: unknown paths fall back to index.html
    location / { try_files $uri /index.html; }
}
